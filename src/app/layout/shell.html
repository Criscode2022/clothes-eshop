<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>

<p class="announcement">
  <span>Free shipping from $200.</span>
  <span class="announcement__more"
    >No card needed: pay at the shop, by bank transfer, or in cash on delivery.</span
  >
</p>

<app-site-header />

<main id="main-content" class="site-main" tabindex="-1" #main>
  <router-outlet />
</main>

<app-site-footer />

<app-bag-panel />

<div class="toast-region" role="status">
  @if (bag.noticeMessage(); as notice) {
    <p class="toast" animate.enter="line-enter" animate.leave="line-leave">
      <span>{{ notice }}</span>
      <button type="button" class="toast__close" (click)="dismissNotice()">
        <app-icon name="close" [size]="16" />
        <span class="sr-only">Dismiss</span>
      </button>
    </p>
  }
</div>
