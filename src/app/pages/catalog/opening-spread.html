@if (tiles().length > 0) {
  <ul class="spread" role="list" appSlideTrack appSlideShow #photos="slideTrack" #turns="slideShow">
    @for (tile of tiles(); track tile.piece.id; let first = $first) {
      <li class="spread__tile">
        <a class="spread__link" [routerLink]="['/product', tile.piece.id]">
          <!-- The first fills a phone's screen; the others are one swipe away, so they load now too. -->
          <picture>
            <source type="image/avif" [srcset]="tile.photo.avif" />
            <source type="image/jpeg" [srcset]="tile.photo.jpeg" />
            <img
              [ngSrc]="tile.photo.avif"
              width="800"
              height="1200"
              [priority]="first"
              [loading]="first ? undefined : 'eager'"
              alt=""
            />
          </picture>
          <span class="spread__caption">
            <span class="spread__name">{{ tile.piece.name }}</span>
            <span class="spread__price">{{ tile.piece.priceCents | money }}</span>
          </span>
        </a>
      </li>
    }
  </ul>

  <!-- On a phone the photographs take turns; each marker fills while its photograph is in view. -->
  <div class="spread__controls">
    <div
      class="spread__markers"
      role="group"
      aria-label="Photographs"
      [attr.data-turns]="turns.state()"
      [style.--turn-length]="turns.intervalMs + 'ms'"
    >
      @for (tile of tiles(); track tile.piece.id; let index = $index) {
        <button
          type="button"
          class="spread__marker"
          [attr.aria-current]="photos.current() === index ? 'true' : null"
          (click)="photos.show(index)"
        >
          <span class="sr-only">Show {{ tile.piece.name }}</span>
        </button>
      }
    </div>

    <button type="button" class="spread__play" (click)="turns.toggle()">
      @if (turns.playing()) {
        <ng-icon name="lucidePause" aria-hidden="true" />
        <span class="sr-only">Pause the photographs</span>
      } @else {
        <ng-icon name="lucidePlay" aria-hidden="true" />
        <span class="sr-only">Play the photographs</span>
      }
    </button>
  </div>
}
